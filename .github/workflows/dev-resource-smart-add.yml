name: Dev Resource Smart Add analysis

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  analyze:
    if: (github.event.issue.title != null && startsWith(github.event.issue.title, '[Dev Resource Smart Add]')) || (github.event.issue.body != null && contains(github.event.issue.body, '### Resource URL'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/dev-resource-smart-add.mjs --event "$GITHUB_EVENT_PATH" --output "$RUNNER_TEMP/dev-resource-smart-add.json"
      - run: node .github/scripts/ensure-labels.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/github-script@v7
        env:
          RESULT_PATH: ${{ runner.temp }}/dev-resource-smart-add.json
        with:
          script: |
            const fs = require('fs'); const result = JSON.parse(fs.readFileSync(process.env.RESULT_PATH, 'utf8'));
            if (result.skip) return;
            const { owner, repo } = context.repo; const issue_number = context.issue.number;
            if (result.comment) await github.rest.issues.createComment({ owner, repo, issue_number, body: result.comment });
            if (result.convert && result.canonicalBody) {
              await github.rest.issues.update({ owner, repo, issue_number, title: result.title, body: result.canonicalBody });
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: result.labels });
              const remove = result.labels.includes('pending') ? 'needs-changes' : 'pending';
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number, name: remove }); } catch (error) { const status = error.status ?? error.response?.status; if (status !== 404) throw error; }
            }
