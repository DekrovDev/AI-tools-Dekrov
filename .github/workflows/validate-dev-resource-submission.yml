name: Validate Dev Resource submission

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: (github.event.issue.body != null && contains(github.event.issue.body, '### Dev Resource JSON')) || contains(github.event.issue.labels.*.name, 'dev-resource-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node .github/scripts/validate-dev-resource-submission.mjs --event "$GITHUB_EVENT_PATH" --output "$RUNNER_TEMP/dev-resource-result.json"
      - run: node .github/scripts/ensure-labels.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/github-script@v7
        env:
          RESULT_PATH: ${{ runner.temp }}/dev-resource-result.json
        with:
          script: |
            const fs = require('fs'); const result = JSON.parse(fs.readFileSync(process.env.RESULT_PATH, 'utf8'));
            if (result.skip) return;
            const details = result.valid ? 'Dev Resource submission is valid and is now **pending** moderation.' : `Submission needs changes:\n${result.errors.map(error => `- ${error}`).join('\n')}`;
            const duplicates = result.duplicates?.length ? `\n\nPotential duplicates:\n${result.duplicates.map(item => `- ${item.id}: ${item.reasons.join(', ')}`).join('\n')}` : '';
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `## AI-Dekrov Dev Resource validation\n\n${details}${duplicates}` });
            const labels = result.valid ? ['dev-resource-submission', 'pending'] : ['dev-resource-submission', 'needs-changes'];
            await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, labels });
            const remove = result.valid ? 'needs-changes' : 'pending';
            try { await github.rest.issues.removeLabel({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, name: remove }); } catch (error) { const status = error.status ?? error.response?.status; if (status !== 404) throw error; }
