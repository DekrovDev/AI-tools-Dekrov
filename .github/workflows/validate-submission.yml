name: Validate tool submission

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    # Detect by body as well as by label: on a fresh repository the custom
    # labels may not exist yet, and issue forms cannot apply missing labels.
    if: (github.event.issue.body != null && contains(github.event.issue.body, '### Tool JSON')) || contains(github.event.issue.labels.*.name, 'tool-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate structured submission
        run: node .github/scripts/validate-submission.mjs --event "$GITHUB_EVENT_PATH" --output "$RUNNER_TEMP/submission-result.json"
      - name: Ensure required labels exist
        run: node .github/scripts/ensure-labels.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Comment validation result and set moderation state
        uses: actions/github-script@v7
        env:
          RESULT_PATH: ${{ runner.temp }}/submission-result.json
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync(process.env.RESULT_PATH, 'utf8'));
            if (result.skip) {
              console.log('Not a tool submission; nothing to do.');
              return;
            }
            const details = result.valid
              ? 'Submission is valid and is now **pending** moderation.'
              : `Submission needs changes:\n${result.errors.map(error => `- ${error}`).join('\n')}`;
            const duplicates = result.duplicates?.length
              ? `\n\nPotential duplicates:\n${result.duplicates.map(item => `- ${item.id}: ${item.reasons.join(', ')}`).join('\n')}`
              : '';
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `## AI-Dekrov validation\n\n${details}${duplicates}` });
            await github.rest.issues.setLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, labels: result.valid ? ['tool-submission', 'pending'] : ['tool-submission', 'needs-changes'] });
